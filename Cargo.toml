[workspace]
resolver = "2"
members = ["rustfrp-core", "rustfrp-agent", "rustfrp-server", "rustfrp-ui-assets"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat", "codec", "io"] }
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
yamux = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
ring = "0.17"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# 调试构建里 Argon2 太慢会拖累测试；依赖库用优化编译（不影响我们自己的代码调试）。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3
