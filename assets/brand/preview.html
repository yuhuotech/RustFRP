<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RustFRP 品牌预览</title>
<style>
body{margin:0;background:#f5f7f1;color:#243017;font-family:system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:48px 24px}h1{font-size:32px;margin:0 0 12px}p{color:#627052;line-height:1.7}.hero{display:flex;align-items:center;gap:48px;padding:40px;background:white;border-radius:28px;margin:32px 0}.hero img{width:280px;height:280px}.hero strong{font-size:40px}.samples{display:flex;align-items:end;gap:28px;flex-wrap:wrap}.sample{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:13px}.panel{padding:32px;border-radius:24px;background:white;margin-top:24px}.dark{background:#182115;color:white}.marks{display:flex;gap:36px;align-items:center}.marks img{width:96px;height:96px} @media(max-width:640px){.hero{flex-direction:column;gap:24px}.hero img{width:220px;height:220px}}
</style>
<main><h1>RustFRP</h1><p>内外双环 · 一笔贯通 · 草绿渐变</p><div class="hero"><img src="rustfrp-logo.svg" alt="RustFRP 新 Logo"><div><strong>连接内外网</strong><p>更饱满的主体，更清晰的小尺寸识别。<br>两个网络，经隧道连成一个整体。</p></div></div>
<div class="panel"><div class="samples" id="light"></div></div><div class="panel dark"><div class="samples" id="dark"></div></div><div class="panel marks"><img src="rustfrp-mark.svg" alt="绿色符号"><img src="rustfrp-mark-black.svg" alt="黑色符号"></div><div class="panel dark marks"><img src="rustfrp-mark-white.svg" alt="白色符号"></div>
<script>for(const id of ['light','dark'])for(const size of [16,24,32,48,64,128]){const item=document.createElement('div');item.className='sample';const img=document.createElement('img');img.src=`rustfrp-logo-${size===24?32:size===48?64:size}.png`;img.width=img.height=size;img.alt=`RustFRP ${size}px`;item.append(img,document.createTextNode(`${size}px`));document.getElementById(id).append(item)}</script></main></html>
