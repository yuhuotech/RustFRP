server {
    listen 80;
    listen [::]:80;
    server_name rustfrp.dev99.cn;
    return 301 https://rustfrp.dev99.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rustfrp.dev99.cn;
    ssl_certificate /etc/nginx/cert/dev99.cn.crt;
    ssl_certificate_key /etc/nginx/cert/dev99.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/rustfrp-test-access.log;
    error_log /var/log/nginx/rustfrp-test-error.log;
    location / {
        proxy_pass http://127.0.0.1:28080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
