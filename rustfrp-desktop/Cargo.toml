[workspace]
resolver = "2"
members = [".", "crates/support"]

[package]
name = "rustfrp-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
build = "build.rs"

[features]
native-e2e = []

[dependencies]
rustfrp-desktop-support = { path = "crates/support" }
tauri = { version = "=2.12.3", features = ["tray-icon"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
arboard = { version = "=3.6.1", default-features = false }
open = "=5.4.4"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-dialog = "=2.7.3"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
