[package]
name = "rustfrp-desktop-support"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
rustfrp-core = { path = "../../../rustfrp-core" }
sha2 = "0.10"
fs2 = "0.4"
tempfile = "3"
plist = "1"
ring = "0.17"
semver = "1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
