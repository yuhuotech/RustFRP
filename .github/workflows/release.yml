name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rustfrp-ui/package-lock.json
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Rust checks
        run: make ui-deps ui-build rust-lint rust-test core-cov agent-cov server-cov assets-cov
      - name: Shared DOM UI checks and standalone panel
        env:
          RUSTFRP_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          make ui-test ui-cov ui-build
          tar -czf rustfrp-panel.tar.gz -C rustfrp-ui/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: release-panel
          path: rustfrp-panel.tar.gz

  linux:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RUSTFRP_RELEASE_VERSION: ${{ github.ref_name }}
      RUSTFRP_RELEASE_REPOSITORY: ${{ github.repository }}
      RUSTFRP_RELEASE_PUBLIC_KEY_HEX: ${{ vars.RUSTFRP_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rustfrp-ui/package-lock.json
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make ui-deps ui-build
          cargo build --release --bins --features rustfrp-server/embedded-panel
          (cd rustfrp-desktop && node ../rustfrp-ui/node_modules/@tauri-apps/cli/tauri.js build --no-bundle --config "{\"version\":\"$VERSION\"}")
          python3 tools/release/package.py --platform linux --desktop rustfrp-desktop/target/release/rustfrp_app --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*

  macos:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFRP_RELEASE_VERSION: ${{ github.ref_name }}
      RUSTFRP_RELEASE_REPOSITORY: ${{ github.repository }}
      RUSTFRP_RELEASE_PUBLIC_KEY_HEX: ${{ vars.RUSTFRP_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rustfrp-ui/package-lock.json
      - name: Build and sign application
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUSTFRP_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_DEVELOPER_IDENTITY APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required release secret: $name" >&2; exit 1; }
          done
          VERSION="${GITHUB_REF_NAME#v}"
          make ui-deps ui-build
          cargo build --release --bins --features rustfrp-server/embedded-panel
          (cd rustfrp-desktop && node ../rustfrp-ui/node_modules/@tauri-apps/cli/tauri.js build --bundles app --config "{\"version\":\"$VERSION\"}")
          APP="rustfrp-desktop/target/release/bundle/macos/RustFRP.app"
          mkdir -p "$APP/Contents/Resources/bin" dist
          cp target/release/rustfrp-agent target/release/rustfrp-server "$APP/Contents/Resources/bin/"
          KEYCHAIN="$RUNNER_TEMP/rustfrp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "$APP/Contents/Resources/bin/rustfrp-agent"
          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "$APP/Contents/Resources/bin/rustfrp-server"
          cp "$APP/Contents/Resources/bin/rustfrp-agent" "dist/rustfrp-agent-macos-${RUSTFRP_ARCH}"
          shasum -a 256 "dist/rustfrp-agent-macos-${RUSTFRP_ARCH}" | cut -d ' ' -f 1 > "dist/rustfrp-agent-macos-${RUSTFRP_ARCH}.sha256"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil create -volname RustFRP -srcfolder "$APP" -ov -format UDZO "dist/rustfrp-macos-${RUSTFRP_ARCH}.dmg"
          codesign --force --timestamp --sign "$APPLE_DEVELOPER_IDENTITY" "dist/rustfrp-macos-${RUSTFRP_ARCH}.dmg"
          xcrun notarytool submit "dist/rustfrp-macos-${RUSTFRP_ARCH}.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "dist/rustfrp-macos-${RUSTFRP_ARCH}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/rustfrp-macos-${RUSTFRP_ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      RUSTFRP_RELEASE_VERSION: ${{ github.ref_name }}
      RUSTFRP_RELEASE_REPOSITORY: ${{ github.repository }}
      RUSTFRP_RELEASE_PUBLIC_KEY_HEX: ${{ vars.RUSTFRP_RELEASE_PUBLIC_KEY_HEX }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rustfrp-ui/package-lock.json
      - name: Build and package
        shell: pwsh
        run: |
          $env:RUSTFRP_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          npm ci --prefix rustfrp-ui
          npm run --prefix rustfrp-ui build
          cargo build --release --bins --features rustfrp-server/embedded-panel
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          Push-Location rustfrp-desktop
          $configuration = @{ version = $env:RUSTFRP_VERSION } | ConvertTo-Json -Compress
          node ../rustfrp-ui/node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --config $configuration
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
          Pop-Location
          python tools/release/package.py --platform windows --desktop rustfrp-desktop/target/release/rustfrp_app.exe --version $env:RUSTFRP_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          $installers = @(Get-ChildItem rustfrp-desktop/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one native installer' }
          Copy-Item $installers[0].FullName dist/rustfrp-windows-x86_64-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Sign release manifest and publish
        env:
          RUSTFRP_RELEASE_SIGNING_KEY_PEM: ${{ secrets.RUSTFRP_RELEASE_SIGNING_KEY_PEM }}
          RUSTFRP_RELEASE_PUBLIC_KEY_HEX: ${{ vars.RUSTFRP_RELEASE_PUBLIC_KEY_HEX }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$RUSTFRP_RELEASE_SIGNING_KEY_PEM" || { echo 'Missing RUSTFRP_RELEASE_SIGNING_KEY_PEM secret' >&2; exit 1; }
          test -n "$RUSTFRP_RELEASE_PUBLIC_KEY_HEX" || { echo 'Missing RUSTFRP_RELEASE_PUBLIC_KEY_HEX repository variable' >&2; exit 1; }
          cd dist
          printf '%s\n' "$GITHUB_REF_NAME" > RELEASE_VERSION
          printf '%s\n' "$RUSTFRP_RELEASE_SIGNING_KEY_PEM" > "$RUNNER_TEMP/rustfrp-release-key.pem"
          openssl pkey -in "$RUNNER_TEMP/rustfrp-release-key.pem" -pubout -out RUSTFRP_RELEASE_PUBLIC_KEY.pem
          ACTUAL_KEY_HEX="$(openssl pkey -in "$RUNNER_TEMP/rustfrp-release-key.pem" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          test "${ACTUAL_KEY_HEX,,}" = "${RUSTFRP_RELEASE_PUBLIC_KEY_HEX,,}" || { echo 'Pinned updater key does not match release signing key' >&2; exit 1; }
          printf '%s\n' "$GITHUB_REF_NAME" > RELEASE_VERSION
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/rustfrp-release-key.pem" -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/rustfrp-release-key.pem"
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
