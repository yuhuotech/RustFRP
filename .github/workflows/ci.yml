name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: fmt / clippy
        run: make lint
      - name: test
        run: make test
      - name: Rust coverage gate (line / function / branch >= 90%)
        run: make core-cov agent-cov server-cov

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libx11-dev libxi-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: analyze + test + coverage (line >= 90%)
        run: |
          cd rustfrp-app
          flutter pub get
          flutter analyze
          flutter test --coverage
          cd ..
          python3 tools/cov/check_lcov.py rustfrp-app/coverage/lcov.info --name rustfrp-app --list-gaps
      - name: web build (same-origin panel)
        run: cd rustfrp-app && flutter build web --no-web-resources-cdn

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make e2e
      - run: make bench-mem
